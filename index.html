<!doctype html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바둑정석암기">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>바둑정석암기</title>
<style>
  :root{
    --bg:#F2EFE8;
    --surface:#FFFFFF;
    --surface2:#EAE5D9;
    --ink:#22201A;
    --muted:#6E6757;
    --line:#DDD6C6;
    --accent:#8A5A2B;
    --accent-ink:#FFFFFF;
    --good:#2F8A55;
    --bad:#C24634;
    --wood1:#E2B45B;
    --wood2:#D2A24A;
    --wood-line:#5A4520;
    --shadow:0 2px 10px rgba(40,30,10,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16140E;
      --surface:#211E15;
      --surface2:#2B2718;
      --ink:#EDE7D8;
      --muted:#9A9280;
      --line:#3A3524;
      --accent:#D2A24A;
      --accent-ink:#241B08;
      --good:#4CB878;
      --bad:#E06450;
      --shadow:0 2px 12px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#F2EFE8; --surface:#FFFFFF; --surface2:#EAE5D9; --ink:#22201A;
    --muted:#6E6757; --line:#DDD6C6; --accent:#8A5A2B; --accent-ink:#FFFFFF;
    --good:#2F8A55; --bad:#C24634; --shadow:0 2px 10px rgba(40,30,10,.10);
  }
  :root[data-theme="dark"]{
    --bg:#16140E; --surface:#211E15; --surface2:#2B2718; --ink:#EDE7D8;
    --muted:#9A9280; --line:#3A3524; --accent:#D2A24A; --accent-ink:#241B08;
    --good:#4CB878; --bad:#E06450; --shadow:0 2px 12px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP","Noto Sans SC","Microsoft YaHei",sans-serif;
    line-height:1.5;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0;}
  input,textarea{font:inherit; color:var(--ink);}

  .app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
       display:flex; flex-direction:column; padding-bottom:76px;}

  header.top{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px 10px;
  }
  header.top h1{
    font-size:1.15rem; font-weight:800; letter-spacing:-.02em; margin:0;
  }
  header.top .sub{font-size:.78rem; color:var(--muted); margin-left:auto;}
  .logo{width:26px; height:26px; flex:none;}
  .langbtn{
    flex:none; background:var(--surface2); border-radius:8px;
    padding:6px 10px; font-size:.75rem; font-weight:700; color:var(--ink);
  }

  main{flex:1; display:flex; flex-direction:column; padding:0 12px;}
  .view{display:flex; flex-direction:column; gap:10px;}
  .view[hidden]{display:none;}

  /* ---------- controls ---------- */
  .panel-row{display:flex; align-items:center; gap:10px;}
  .seg{
    display:flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px;
  }
  .seg button{
    padding:7px 12px; border-radius:8px; font-size:.85rem; font-weight:600; color:var(--muted);
  }
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .seg.zoom{align-self:center;}
  .seg.zoom button{padding:6px 10px; font-size:.8rem;}
  .counter{margin-left:auto; font-size:.9rem; color:var(--muted);}
  .counter b{color:var(--ink); font-variant-numeric:tabular-nums; font-size:1.05rem;}

  /* ---------- board ---------- */
  .board-wrap{
    border-radius:14px; overflow:hidden; box-shadow:var(--shadow);
    background:var(--wood2); touch-action:manipulation;
  }
  .board-wrap svg{display:block; width:100%; height:auto;}
  .stone-num{
    font-family:inherit; font-weight:700; font-variant-numeric:tabular-nums;
    pointer-events:none; user-select:none;
  }
  .ghost-stone{animation:pulse 1.1s ease-in-out infinite;}
  .hint-ring{fill:none; stroke:var(--good); stroke-width:3; animation:pulse 1.1s ease-in-out infinite;}
  .wrong-x line{stroke:var(--bad); stroke-width:4; stroke-linecap:round;}
  .wrong-x{animation:fadeout 1s ease forwards;}
  .last-ring{fill:none; stroke-width:2; pointer-events:none;}
  @keyframes pulse{0%,100%{opacity:.85} 50%{opacity:.35}}
  @keyframes fadeout{0%{opacity:1} 70%{opacity:1} 100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .ghost-stone,.hint-ring{animation:none; opacity:.7;}
    .wrong-x{animation:none;}
  }

  /* ---------- confirm bar ---------- */
  .confirmbar{
    min-height:52px; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .confirmbar .hinttext{font-size:.85rem; color:var(--muted);}
  .confirmbar[data-active="1"] .hinttext{display:none;}
  .confirmbar .cbtns{display:none; gap:10px; width:100%;}
  .confirmbar[data-active="1"] .cbtns{display:flex;}
  .confirmbar .place{
    flex:1; background:var(--accent); color:var(--accent-ink);
    border-radius:11px; padding:12px; font-weight:700; font-size:.95rem;
  }
  .confirmbar .cancel{
    background:var(--surface2); border-radius:11px; padding:12px 18px; font-weight:600; font-size:.9rem;
  }

  /* ---------- buttons ---------- */
  .actions{display:flex; gap:8px;}
  .ghostbtn{
    background:var(--surface2); border-radius:11px; padding:11px 12px;
    font-size:.85rem; font-weight:600; color:var(--ink);
  }
  .primary{
    flex:1; background:var(--ink); color:var(--bg); border-radius:11px;
    padding:12px; font-weight:700; font-size:.95rem;
  }
  .primary:disabled{opacity:.35; cursor:default;}

  /* ---------- list ---------- */
  .card{
    background:var(--surface); border-radius:14px; padding:14px 16px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:12px;
  }
  .card .info{flex:1; min-width:0;}
  .card .name{font-weight:700; font-size:1rem; letter-spacing:-.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .meta{font-size:.78rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .card .go{
    background:var(--accent); color:var(--accent-ink); border-radius:10px;
    padding:9px 12px; font-weight:700; font-size:.83rem; flex:none;
  }
  .card .viewbtn{
    background:var(--surface2); color:var(--ink); border-radius:10px;
    padding:9px 12px; font-weight:700; font-size:.83rem; flex:none;
  }
  .card .del{color:var(--muted); font-size:.78rem; padding:8px 2px; flex:none;}
  .browsebar{
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .browsebar button{
    background:var(--surface2); border-radius:10px; padding:10px 14px;
    font-size:1rem; font-weight:700; color:var(--ink); min-width:48px;
  }
  .browsebar button:disabled{opacity:.3; cursor:default;}
  .browsebar .brcount{
    min-width:88px; text-align:center; font-size:.9rem; font-weight:700;
    color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .browsehint{text-align:center; color:var(--muted); font-size:.78rem;}
  .empty{
    text-align:center; color:var(--muted); padding:48px 20px; font-size:.9rem;
  }
  .empty b{color:var(--ink);}
  .listhint{text-align:center; color:var(--muted); font-size:.75rem; padding:4px 0 0;}
  .folderbar{
    display:flex; gap:6px; overflow-x:auto; padding:2px 2px 4px;
    scrollbar-width:none;
  }
  .folderbar::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; background:var(--surface2); border-radius:999px;
    padding:7px 13px; font-size:.8rem; font-weight:600; color:var(--muted);
    white-space:nowrap;
  }
  .chip.on{background:var(--ink); color:var(--bg);}
  .chip .cnt{font-variant-numeric:tabular-nums; opacity:.75; margin-left:3px;}
  .chip.add{border:1.5px dashed var(--line); background:none;}
  .listbar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .exambtn{
    background:var(--surface2); border-radius:8px; padding:7px 12px;
    font-size:.78rem; font-weight:700; color:var(--ink);
  }
  .breaklist{
    max-height:180px; overflow-y:auto; text-align:left;
    font-size:.85rem; color:var(--ink); display:flex; flex-direction:column; gap:5px;
    background:var(--surface2); border-radius:10px; padding:10px 12px;
  }
  .sortsel{
    background:var(--surface2); border:none; border-radius:8px;
    padding:7px 10px; font-size:.78rem; font-weight:600; color:var(--ink);
    font-family:inherit;
  }
  .modal select{
    width:100%; background:var(--surface2); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:.95rem; font-family:inherit;
  }
  .modal .flabel{font-size:.78rem; font-weight:700; color:var(--muted);}
  .editbanner{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1.5px dashed var(--accent); border-radius:11px;
    padding:9px 13px; font-size:.85rem;
  }
  .editbanner .ebtext{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--accent); font-weight:700;}
  .editbanner button{color:var(--bad); font-weight:700; font-size:.8rem; flex:none; padding:4px;}
  .modal .menulist{display:flex; flex-direction:column; gap:8px;}
  .modal .menulist button{
    background:var(--surface2); border-radius:10px; padding:13px;
    font-weight:700; font-size:.92rem; text-align:center;
  }
  .modal .menulist button.danger{color:var(--bad);}
  .modal .menulist button.quiet{background:none; color:var(--muted); font-weight:600; padding:9px;}
  .modal .mdesc{color:var(--muted); font-size:.85rem;}

  /* ---------- play ---------- */
  .play-head{display:flex; align-items:center; gap:8px;}
  .play-head .back{
    background:var(--surface2); border-radius:9px; padding:7px 11px; font-size:.85rem; font-weight:600;
  }
  .play-head .pname{font-weight:800; letter-spacing:-.01em; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .play-head .prog{font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .progressbar{height:4px; background:var(--surface2); border-radius:2px; overflow:hidden;}
  .progressbar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease;}
  .status{
    min-height:24px; text-align:center; font-size:.92rem; font-weight:600;
  }
  .status.bad{color:var(--bad);}
  .status.good{color:var(--good);}
  .play-tools{display:flex; align-items:center; justify-content:center; gap:14px;}
  .play-tools .hintbtn{
    background:var(--surface2); border-radius:10px; padding:9px 14px; font-size:.85rem; font-weight:600;
  }
  .play-tools .miss{font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .donepanel{
    background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
    padding:20px; text-align:center; display:flex; flex-direction:column; gap:10px;
  }
  .donepanel .big{font-size:1.2rem; font-weight:800;}
  .donepanel .stats{color:var(--muted); font-size:.9rem;}
  .donepanel .row{display:flex; gap:8px; margin-top:4px;}
  .donepanel .row button{flex:1; border-radius:11px; padding:11px; font-weight:700; font-size:.9rem;}
  .donepanel .again{background:var(--accent); color:var(--accent-ink);}
  .donepanel .tolist{background:var(--surface2);}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; justify-content:center; gap:0;
    background:var(--surface); border-top:1px solid var(--line);
    padding:6px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    width:130px; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--muted); font-size:.72rem; font-weight:600; padding:4px 0;
  }
  .tabbar button.on{color:var(--accent);}
  .tabbar .ticon{width:24px; height:24px;}

  /* ---------- modal / toast ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,8,4,.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal{
    background:var(--surface); border-radius:16px; padding:20px;
    width:100%; max-width:340px; box-shadow:0 10px 40px rgba(0,0,0,.3);
    display:flex; flex-direction:column; gap:14px;
  }
  .modal h2{margin:0; font-size:1.05rem; font-weight:800; letter-spacing:-.01em;}
  .modal .mbody{display:flex; flex-direction:column; gap:10px;}
  .modal input[type=text], .modal textarea{
    width:100%; background:var(--surface2); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; font-size:.95rem; outline:none;
  }
  .modal input[type=text]:focus, .modal textarea:focus{border-color:var(--accent);}
  .modal textarea{min-height:110px; resize:vertical; font-size:.8rem;}
  .modal .mbtns{display:flex; gap:8px;}
  .modal .mbtns button{
    flex:1; border-radius:10px; padding:11px; font-weight:700; font-size:.9rem;
    background:var(--surface2);
  }
  .modal .mbtns button.acc{background:var(--accent); color:var(--accent-ink);}
  .modal .mbtns button.danger{background:var(--bad); color:#fff;}
  .modal .bigchoice{display:flex; gap:10px;}
  .modal .bigchoice button{
    flex:1; border-radius:12px; padding:16px 8px; font-weight:700; font-size:.95rem;
    background:var(--surface2); display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .modal .bigchoice .cstone{width:34px; height:34px; border-radius:50%;}
  .modal .bigchoice .cb{background:radial-gradient(circle at 35% 30%,#555,#000);}
  .modal .bigchoice .cw{background:radial-gradient(circle at 35% 30%,#fff,#ccc); border:1px solid #999;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); border-radius:10px;
    padding:10px 18px; font-size:.85rem; font-weight:600; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}

  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="9" cy="13" r="7.5" fill="#111"/>
      <circle cx="17" cy="13" r="7.5" fill="#fff" stroke="#888" stroke-width="1"/>
    </svg>
    <h1 id="appTitle">바둑정석암기</h1>
    <span class="sub" id="headSub"></span>
    <button class="langbtn" id="btnLang">🌐</button>
  </header>

  <main>
    <!-- ============ 입력 ============ -->
    <section class="view" id="view-input">
      <div class="panel-row">
        <div class="seg" id="firstSeg">
          <button data-c="B" class="on"></button>
          <button data-c="W"></button>
        </div>
        <div class="counter"><b id="inCount">0</b> <span id="inCountUnit"></span></div>
      </div>

      <div class="editbanner" id="editBanner" hidden>
        <span class="ebtext" id="editBannerText"></span>
        <button id="editCancel"></button>
      </div>

      <div class="board-wrap" id="inputBoardWrap"></div>

      <div class="seg zoom" id="inputZoom"></div>

      <div class="confirmbar" id="inConfirm" data-active="0">
        <span class="hinttext" id="inHintText"></span>
        <div class="cbtns">
          <button class="cancel" id="inCancel"></button>
          <button class="place" id="inPlace"></button>
        </div>
      </div>

      <div class="actions">
        <button class="ghostbtn" id="btnUndo"></button>
        <button class="ghostbtn" id="btnClear"></button>
        <button class="primary" id="btnSave"></button>
      </div>
    </section>

    <!-- ============ 목록 ============ -->
    <section class="view" id="view-list" hidden>
      <div class="folderbar" id="folderBar"></div>
      <div class="listbar">
        <button class="exambtn" id="btnExam"></button>
        <select id="sortSel" class="sortsel">
          <option value="new"></option>
          <option value="mtime"></option>
          <option value="name_asc"></option>
          <option value="name_desc"></option>
        </select>
      </div>
      <div id="listBox" style="display:flex;flex-direction:column;gap:10px;"></div>
      <div class="backup">
        <button id="btnSgf"></button>
        <button id="btnExport"></button>
        <button id="btnImport"></button>
      </div>
    </section>

    <!-- ============ 복습 플레이 ============ -->
    <section class="view" id="view-play" hidden>
      <div class="play-head">
        <button class="back" id="btnBack"></button>
        <div class="pname" id="playName"></div>
        <div class="prog" id="playProg"></div>
      </div>
      <div class="progressbar"><i id="progFill"></i></div>

      <div class="status" id="playStatus"></div>

      <div class="board-wrap" id="playBoardWrap"></div>

      <div class="seg zoom" id="playZoom"></div>

      <div class="confirmbar" id="pConfirm" data-active="0">
        <span class="hinttext" id="pHintText"></span>
        <div class="cbtns">
          <button class="cancel" id="pCancel"></button>
          <button class="place" id="pPlace"></button>
        </div>
      </div>

      <div class="play-tools" id="playTools">
        <button class="hintbtn" id="btnHint"></button>
        <span class="miss" id="missCount"></span>
      </div>

      <div class="donepanel" id="donePanel" hidden>
        <div class="big" id="doneBig"></div>
        <div class="stats" id="doneStats"></div>
        <div class="breaklist" id="doneBreak" hidden></div>
        <div class="row">
          <button class="tolist" id="doneList"></button>
          <button class="again" id="doneAgain"></button>
        </div>
      </div>
    </section>
    <!-- ============ 살펴보기 ============ -->
    <section class="view" id="view-browse" hidden>
      <div class="play-head">
        <button class="back" id="brBack"></button>
        <div class="pname" id="brName"></div>
      </div>

      <div class="board-wrap" id="browseBoardWrap"></div>

      <div class="seg zoom" id="browseZoom"></div>

      <div class="browsebar">
        <button id="brFirst">⏮</button>
        <button id="brPrev">◀</button>
        <span class="brcount" id="brCount"></span>
        <button id="brNext">▶</button>
        <button id="brLast">⏭</button>
      </div>
      <div class="browsehint" id="brHint"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button id="tabInput" class="on">
      <svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 3v18M9 3v18M15 3v18M21 3v18M3 3h18M3 9h18M3 15h18M3 21h18" opacity=".45"/>
        <circle cx="15" cy="9" r="3.4" fill="currentColor" stroke="none"/>
      </svg>
      <span id="tabInputLbl"></span>
    </button>
    <button id="tabReview">
      <svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 5h16M4 12h16M4 19h10" stroke-linecap="round"/>
        <circle cx="19" cy="19" r="3" fill="currentColor" stroke="none"/>
      </svg>
      <span id="tabReviewLbl"></span>
    </button>
  </nav>
</div>

<div class="modal-backdrop" id="modalBack" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ===================== 다국어 ===================== */
  var LANG_NAMES = { ko:"한국어", zh:"中文", ja:"日本語", en:"English" };
  var LOCALES = { ko:"ko", zh:"zh", ja:"ja", en:"en" };
  var L = {
  ko: {
    app_title:"바둑정석암기", tab_input:"정석 입력", tab_review:"복습",
    sub_input:"새 정석 입력", sub_list:"저장된 정석", sub_play:"복습 중", sub_browse:"정석 살펴보기",
    browse_btn:"살펴보기", browse_hint:"버튼으로 수순을 하나씩 넘겨볼 수 있습니다", browse_all:"전체 수순",
    first_black:"● 흑 선착", first_white:"○ 백 선착", moves_unit:"수",
    black:"흑", white:"백",
    editing_fmt:"「{0}」 수정 중", edit_cancel:"수정 취소", edit_canceled:"수정을 취소했습니다",

  function t(k){ return (L[prefs.lang] && L[prefs.lang][k]) || L.ko[k] || k; }
  function tf(k){
    var s = t(k);
    for(var i=1;i<arguments.length;i++){ s = s.replace("{"+(i-1)+"}", arguments[i]); }
    return s;
  }
  function colorName(c){ return c==="B" ? t("black") : t("white"); }

  /* ===================== 저장소 ===================== */
  var STORE_KEY = "joseki_trainer_v1";
  function loadAll(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveAll(list){
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
  }

  var FOLDER_KEY = "joseki_trainer_folders_v1";
  var PREF_KEY = "joseki_trainer_prefs_v1";
  function loadFolders(){
    try{
      var a = JSON.parse(localStorage.getItem(FOLDER_KEY) || "[]");
      return Array.isArray(a) ? a.filter(function(x){ return typeof x === "string" && x; }) : [];
    }catch(e){ return []; }
  }
  function saveFolders(a){ localStorage.setItem(FOLDER_KEY, JSON.stringify(a)); }
  var prefs = (function(){
    try{
      var p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
      return {
        folder: (typeof p.folder === "string" ? p.folder : "all"),
        sort: p.sort || "new",
        lang: (L[p.lang] ? p.lang : "ko")
      };
    }catch(e){ return { folder:"all", sort:"new", lang:"ko" }; }
  })();
  function savePrefs(){ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }

  function recordStats(itemId, mistakes){
    var list = loadAll();
    for(var k=0;k<list.length;k++){
      if(list[k].id === itemId){
        var s = list[k].stats || { attempts:0, mistakes:0 };
        s.attempts++;
        s.mistakes += mistakes;
        s.lastReview = Date.now();
        list[k].stats = s;
        break;
      }
    }
    saveAll(list);
  }
  function fmtShortDate(t0){
    var d = new Date(t0), now = new Date();
    var md = (d.getMonth()+1) + "." + d.getDate();
    return d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + "." + md;
  }

  var SORTS = {
    new:       function(a,b){ return b.id - a.id; },
    mtime:     function(a,b){ return (b.mtime||b.id) - (a.mtime||a.id); },
    name_asc:  function(a,b){ return a.name.localeCompare(b.name, LOCALES[prefs.lang]); },
    name_desc: function(a,b){ return b.name.localeCompare(a.name, LOCALES[prefs.lang]); }
  };

  /* ===================== 토스트/모달 ===================== */
  var toastTimer = null;
  function toast(msg){
    var tt = $("toast");
    tt.textContent = msg;
    tt.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ tt.classList.remove("show"); }, 1900);
  }

  function showModal(build){
    var back = $("modalBack"), box = $("modalBox");
    box.innerHTML = "";
    build(box, closeModal);
    back.hidden = false;
    function closeModal(){ back.hidden = true; box.innerHTML = ""; }
    back.onclick = function(e){ if(e.target === back) closeModal(); };
    return closeModal;
  }

  /* ===================== 바둑판 ===================== */
  var N = 19, CELL = 30, M = 30, SIZE = CELL*(N-1) + M*2; // 600
  var SVGNS = "http://www.w3.org/2000/svg";
  var VIEWS = {
    full:[0,0,600,600], tl:[0,0,410,410], tr:[190,0,410,410],
    bl:[0,190,410,410], br:[190,190,410,410]
  };
  var VIEW_KEYS = ["full","tl","tr","bl","br"];

  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function px(i){ return M + i*CELL; }

  /* ----- 따내기 규칙 ----- */
  function groupLibs(g, i, j){
    var c = g[i][j].c, seen = {}, stones = [], libs = 0, libSeen = {}, stack = [[i,j]];
    while(stack.length){
      var p = stack.pop(), x = p[0], y = p[1], key = x + "," + y;
      if(seen[key]) continue;
      seen[key] = 1; stones.push(p);
      [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(function(nb){
        var a = nb[0], b = nb[1];
        if(a<0||a>18||b<0||b>18) return;
        var cell = g[a][b];
        if(!cell){
          var lk = a + "," + b;
          if(!libSeen[lk]){ libSeen[lk] = 1; libs++; }
        }else if(cell.c === c && !seen[a + "," + b]){
          stack.push([a,b]);
        }
      });
    }
    return { stones: stones, libs: libs };
  }

  function computeBoard(moves, firstColor, upto){
    var g = [];
    for(var a=0;a<19;a++){ g.push(new Array(19).fill(null)); }
    var n = (upto==null) ? moves.length : upto;
    for(var k=0;k<n;k++){
      var c = (k%2===0) ? firstColor : (firstColor==="B"?"W":"B");
      var opp = c==="B" ? "W" : "B";
      var i = moves[k][0], j = moves[k][1];
      g[i][j] = { c:c, num:k+1 };
      [[i-1,j],[i+1,j],[i,j-1],[i,j+1]].forEach(function(nb){
        var x = nb[0], y = nb[1];
        if(x<0||x>18||y<0||y>18) return;
        if(g[x][y] && g[x][y].c === opp){
          var grp = groupLibs(g, x, y);
          if(grp.libs === 0){
            grp.stones.forEach(function(s){ g[s[0]][s[1]] = null; });
          }
        }
      });
      var own = groupLibs(g, i, j);
      if(own.libs === 0){
        own.stones.forEach(function(s){ g[s[0]][s[1]] = null; });
      }
    }
    return g;
  }

  function tryPlace(moves, firstColor, i, j){
    var g = computeBoard(moves, firstColor, null);
    if(g[i][j]) return "occupied";
    var g2 = computeBoard(moves.concat([[i,j]]), firstColor, null);
    if(!g2[i][j]) return "suicide";
    return null;
  }

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tt = a[i]; a[i] = a[j]; a[j] = tt;
    }
    return a;
  }

  function makeBoard(mount, onTap){
    var svg = el("svg", {viewBox:"0 0 600 600"});

    var defs = el("defs", {});
    defs.innerHTML =
      '<linearGradient id="wood'+mount.id+'" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#E4B75F"/><stop offset="1" stop-color="#CE9E45"/></linearGradient>' +
      '<radialGradient id="gb'+mount.id+'" cx="0.35" cy="0.3" r="0.9">' +
      '<stop offset="0" stop-color="#606060"/><stop offset="1" stop-color="#050505"/></radialGradient>' +
      '<radialGradient id="gw'+mount.id+'" cx="0.35" cy="0.3" r="0.9">' +
      '<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8D8D8"/></radialGradient>';
    svg.appendChild(defs);
    svg.appendChild(el("rect",{x:0,y:0,width:600,height:600,fill:"url(#wood"+mount.id+")"}));

    var grid = el("g",{stroke:"#5A4520","stroke-width":"1"});
    for(var i=0;i<N;i++){
      grid.appendChild(el("line",{x1:px(i),y1:M,x2:px(i),y2:SIZE-M}));
      grid.appendChild(el("line",{x1:M,y1:px(i),x2:SIZE-M,y2:px(i)}));
    }
    grid.appendChild(el("rect",{x:M,y:M,width:CELL*(N-1),height:CELL*(N-1),fill:"none","stroke-width":"2.2"}));
    svg.appendChild(grid);

    var stars = el("g",{fill:"#5A4520"});
    [3,9,15].forEach(function(a){
      [3,9,15].forEach(function(b){
        stars.appendChild(el("circle",{cx:px(a),cy:px(b),r:3.4}));
      });
    });
    svg.appendChild(stars);

    var gStones = el("g",{});
    var gFx = el("g",{});
    svg.appendChild(gStones);
    svg.appendChild(gFx);
    mount.appendChild(svg);

    var boardId = mount.id;
    var hintEl = null, ghostEl = null;

    svg.addEventListener("pointerdown", function(e){
      if(!onTap) return;
      var pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      var m = svg.getScreenCTM();
      if(!m) return;
      var p = pt.matrixTransform(m.inverse());
      var i = Math.round((p.x - M)/CELL), j = Math.round((p.y - M)/CELL);
      if(i<0||i>18||j<0||j>18) return;
      onTap(i,j);
    });

    function stoneG(i,j,color,num){
      var g = el("g",{});
      g.appendChild(el("circle",{
        cx:px(i), cy:px(j), r:13,
        fill: color==="B" ? "url(#gb"+boardId+")" : "url(#gw"+boardId+")",
        stroke: color==="B" ? "#000" : "#666",
        "stroke-width": color==="B" ? "0.5" : "1"
      }));
      if(num != null){
        var tx = el("text",{
          x:px(i), y:px(j)+4.6, "text-anchor":"middle",
          "font-size": num>=100 ? "10.5" : "12.5",
          fill: color==="B" ? "#FFFFFF" : "#111111",
          "class":"stone-num"
        });
        tx.textContent = num;
        g.appendChild(tx);
      }
      return g;
    }

    return {
      setView: function(name){
        var v = VIEWS[name] || VIEWS.full;
        svg.setAttribute("viewBox", v.join(" "));
      },
      render: function(moves, firstColor, lastIdx){
        gStones.innerHTML = "";
        var grid2 = computeBoard(moves, firstColor, null);
        for(var x=0;x<19;x++){
          for(var y=0;y<19;y++){
            var cell = grid2[x][y];
            if(cell) gStones.appendChild(stoneG(x, y, cell.c, cell.num));
          }
        }
        if(lastIdx != null && lastIdx >= 0 && lastIdx < moves.length){
          var lm = moves[lastIdx];
          if(grid2[lm[0]][lm[1]]){
            gStones.appendChild(el("circle",{
              cx:px(lm[0]), cy:px(lm[1]), r:16.5,
              "class":"last-ring", stroke:"#1a5c96", opacity:"0.9"
            }));
          }
        }
      },
      ghost: function(i,j,color){
        this.clearGhost();
        if(i==null) return;
        ghostEl = stoneG(i,j,color,null);
        ghostEl.setAttribute("class","ghost-stone");
        ghostEl.setAttribute("opacity","0.75");
        gFx.appendChild(ghostEl);
      },
      clearGhost: function(){
        if(ghostEl){ ghostEl.remove(); ghostEl = null; }
      },
      hint: function(i,j){
        this.clearHint();
        hintEl = el("circle",{cx:px(i),cy:px(j),r:15,"class":"hint-ring"});
        gFx.appendChild(hintEl);
      },
      clearHint: function(){
        if(hintEl){ hintEl.remove(); hintEl = null; }
      },
      flashWrong: function(i,j){
        var g = el("g",{"class":"wrong-x"});
        var x = px(i), y = px(j), r = 9;
        g.appendChild(el("line",{x1:x-r,y1:y-r,x2:x+r,y2:y+r}));
        g.appendChild(el("line",{x1:x-r,y1:y+r,x2:x+r,y2:y-r}));
        gFx.appendChild(g);
        setTimeout(function(){ g.remove(); }, 1000);
      }
    };
  }

  function buildZoomSeg(mount, onChange){
    mount.innerHTML = "";
    VIEW_KEYS.forEach(function(key, idx){
      var b = document.createElement("button");
      b.textContent = t("zoom_"+key);
      b.dataset.v = key;
      if(idx===0) b.classList.add("on");
      b.addEventListener("click", function(){
        mount.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
        b.classList.add("on");
        onChange(key);
      });
      mount.appendChild(b);
    });
    return {
      set: function(name){
        mount.querySelectorAll("button").forEach(function(x){
          x.classList.toggle("on", x.dataset.v === name);
        });
      }
    };
  }

  function fitView(moves){
    if(!moves.length) return "full";
    var minI=18,maxI=0,minJ=18,maxJ=0;
    moves.forEach(function(m){
      minI=Math.min(minI,m[0]); maxI=Math.max(maxI,m[0]);
      minJ=Math.min(minJ,m[1]); maxJ=Math.max(maxJ,m[1]);
    });
    if(maxI<=12 && maxJ<=12) return "tl";
    if(minI>=6 && maxJ<=12) return "tr";
    if(maxI<=12 && minJ>=6) return "bl";
    if(minI>=6 && minJ>=6) return "br";
    return "full";
  }

  /* ===================== 탭 전환 ===================== */
  var views = { input:$("view-input"), list:$("view-list"), play:$("view-play"), browse:$("view-browse") };
  function subForView(name){
    if(name==="input") return t("sub_input");
    if(name==="list") return t("sub_list");
    if(name==="browse") return t("sub_browse");
    return t("sub_play");
  }
  function showView(name){
    for(var k in views) views[k].hidden = (k!==name);
    $("tabInput").classList.toggle("on", name==="input");
    $("tabReview").classList.toggle("on", name!=="input");
    $("headSub").textContent = subForView(name);
    if(name!=="play"){ stopPlay(); exam = null; }
    if(name!=="browse") browse = null;
  }
  $("tabInput").addEventListener("click", function(){ showView("input"); });
  $("tabReview").addEventListener("click", function(){ renderList(); showView("list"); });

  /* ===================== 입력 화면 ===================== */
  var inMoves = [];
  var inFirst = "B";
  var inPending = null;
  var editingId = null;
  var editingName = "";
  var editingFolder = "";
  var inputBoard = makeBoard($("inputBoardWrap"), onInputTap);
  var inputZoom = buildZoomSeg($("inputZoom"), function(v){ inputBoard.setView(v); });

  function inCurColor(){
    return (inMoves.length%2===0) ? inFirst : (inFirst==="B"?"W":"B");
  }
  function setFirstSeg(c){
    inFirst = c;
    $("firstSeg").querySelectorAll("button").forEach(function(x){
      x.classList.toggle("on", x.dataset.c === c);
    });
  }
  function renderInput(){
    inputBoard.render(inMoves, inFirst, inMoves.length-1);
    $("inCount").textContent = inMoves.length;
    $("btnSave").disabled = inMoves.length < 1;
    $("btnSave").textContent = editingId ? t("save_edit") : t("save_new");
    $("editBanner").hidden = !editingId;
    if(editingId) $("editBannerText").textContent = tf("editing_fmt", editingName);
    if(inPending){
      inputBoard.ghost(inPending[0], inPending[1], inCurColor());
      $("inConfirm").dataset.active = "1";
      $("inPlace").textContent = tf("place_fmt", colorName(inCurColor()), inMoves.length+1);
    }else{
      inputBoard.clearGhost();
      $("inConfirm").dataset.active = "0";
    }
  }
  function onInputTap(i,j){
    var err = tryPlace(inMoves, inFirst, i, j);
    if(err === "occupied"){ toast(t("occupied")); return; }
    if(err === "suicide"){ toast(t("suicide")); return; }
    if(inPending && inPending[0]===i && inPending[1]===j){ confirmInputMove(); return; }
    inPending = [i,j];
    renderInput();
  }
  function confirmInputMove(){
    if(!inPending) return;
    inMoves.push(inPending);
    inPending = null;
    renderInput();
  }
  $("inPlace").addEventListener("click", confirmInputMove);
  $("inCancel").addEventListener("click", function(){ inPending=null; renderInput(); });

  $("firstSeg").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){
      setFirstSeg(b.dataset.c);
      renderInput();
    });
  });

  function startEdit(item){
    inMoves = item.moves.map(function(m){ return [m[0], m[1]]; });
    inPending = null;
    editingId = item.id;
    editingName = item.name;
    editingFolder = item.folder || "";
    setFirstSeg(item.firstColor);
    var v = fitView(inMoves);
    inputBoard.setView(v); inputZoom.set(v);
    showView("input");
    renderInput();
  }
  $("editCancel").addEventListener("click", function(){
    editingId = null; editingName = ""; editingFolder = "";
    inMoves = []; inPending = null;
    renderInput();
    toast(t("edit_canceled"));
    renderList(); showView("list");
  });

  $("btnUndo").addEventListener("click", function(){
    if(inPending){ inPending=null; renderInput(); return; }
    if(inMoves.length){ inMoves.pop(); renderInput(); }
  });

  $("btnClear").addEventListener("click", function(){
    if(!inMoves.length && !inPending) return;
    showModal(function(box, close){
      box.innerHTML = '<h2></h2><div class="mbody mdesc"></div>';
      box.querySelector("h2").textContent = t("clear_title");
      box.querySelector(".mbody").textContent = tf("clear_body_fmt", inMoves.length);
      var btns = document.createElement("div"); btns.className="mbtns";
      var c1 = document.createElement("button"); c1.textContent=t("btn_cancel");
      var c2 = document.createElement("button"); c2.textContent=t("btn_erase"); c2.className="danger";
      c1.onclick = close;
      c2.onclick = function(){ inMoves=[]; inPending=null; renderInput(); close(); };
      btns.appendChild(c1); btns.appendChild(c2); box.appendChild(btns);
    });
  });

  $("btnSave").addEventListener("click", function(){
    if(inMoves.length < 1) return;

  function addLongPress(elm, fn){
    var timer = null, sx = 0, sy = 0, fired = false;
    elm.addEventListener("pointerdown", function(e){
      sx = e.clientX; sy = e.clientY; fired = false;
      clearTimeout(timer);
      timer = setTimeout(function(){ fired = true; fn(); }, 550);
    });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
      elm.addEventListener(ev, function(){ clearTimeout(timer); });
    });
    elm.addEventListener("pointermove", function(e){
      if(Math.abs(e.clientX-sx) + Math.abs(e.clientY-sy) > 12) clearTimeout(timer);
    });
    elm.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    elm.addEventListener("click", function(e){
      if(fired){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  }

  /* ===================== SGF 가져오기 ===================== */
  function parseSGF(text){
    text = (text || "").trim();
    var pos = text.indexOf("(");
    if(pos < 0) return { error: t("err_sgf") };
    var props = [];

    function skipTree(){
      var d = 0;
      while(pos < text.length){
        var c = text[pos];
        if(c === "["){
          pos++;
          while(pos < text.length && text[pos] !== "]"){ if(text[pos] === "\\") pos++; pos++; }
          pos++;
          continue;
        }
        pos++;
        if(c === "(") d++;
        else if(c === ")"){ d--; if(d <= 0) return; }
      }
    }
    function parseNode(){
      while(pos < text.length){
        while(pos < text.length && /\s/.test(text[pos])) pos++;
        var c = text[pos];
        if(!c || c === ";" || c === "(" || c === ")") return;
        var ident = "";
        while(pos < text.length && /[A-Za-z]/.test(text[pos])){ ident += text[pos++]; }
        if(!ident){ pos++; continue; }
        var vals = [];
        while(pos < text.length){
          while(pos < text.length && /\s/.test(text[pos])) pos++;
          if(text[pos] !== "[") break;
          pos++;
          var v = "";
          while(pos < text.length && text[pos] !== "]"){
            if(text[pos] === "\\") pos++;
            v += text[pos++];
          }
          pos++;
          vals.push(v);
        }
        props.push({ id: ident.toUpperCase(), vals: vals });
      }
    }
    function parseMain(){
      pos++;
      while(pos < text.length){
        var c = text[pos];
        if(c === ";"){ pos++; parseNode(); }
        else if(c === "("){
          parseMain();
          while(pos < text.length && text[pos] !== ")"){
            if(text[pos] === "(") skipTree();
            else pos++;
          }
          pos++;
          return;
        }
        else if(c === ")"){ pos++; return; }
        else pos++;
      }
    }
    parseMain();

    var name = "", notes = [], moves = [], firstColor = null;
    var ignoredSetup = false, truncated = false;
    for(var k=0;k<props.length;k++){
      var p = props[k];
      if(p.id === "SZ" && p.vals[0] && parseInt(p.vals[0],10) !== 19){
        return { error: t("err_size") };
      }else if(p.id === "GN" && p.vals[0]){
        name = p.vals[0];
      }else if(p.id === "AB" || p.id === "AW"){
        ignoredSetup = true;
      }else if(p.id === "B" || p.id === "W"){
        if(truncated) continue;
        var v = (p.vals[0] || "").toLowerCase();
        if(v === "" || v === "tt"){ truncated = true; notes.push(t("note_pass")); continue; }
        var x = v.charCodeAt(0)-97, y = v.charCodeAt(1)-97;
        if(x<0||x>18||y<0||y>18){ truncated = true; notes.push(t("note_coord")); continue; }
        var col = p.id;
        if(firstColor === null) firstColor = col;
        var expected = (moves.length%2===0) ? firstColor : (firstColor==="B"?"W":"B");
        if(col !== expected){ truncated = true; notes.push(t("note_alt")); continue; }
        moves.push([x,y]);
      }
    }
    if(!moves.length) return { error: t("err_nomoves") };
    if(ignoredSetup) notes.push(t("note_setup"));
    return { name:name, firstColor:firstColor, moves:moves, notes:notes };
  }

  function sgfSaveModal(r, fname){
    showModal(function(box, close){
      box.innerHTML = '<h2></h2>';
      box.querySelector("h2").textContent = t("sgf_save_title");
      var body = document.createElement("div"); body.className="mbody";
      var inp = document.createElement("input");
      inp.type="text"; inp.maxLength=40;
      inp.value = r.name || fname || t("sgf_default");
      body.appendChild(inp);
      var folders = loadFolders();
      var fsel = null;
      if(folders.length){
        var fl = document.createElement("div"); fl.className="flabel"; fl.textContent=t("folder_label");
        body.appendChild(fl);
        fsel = document.createElement("select");
        var o0 = document.createElement("option"); o0.value=""; o0.textContent=t("folder_none");
        fsel.appendChild(o0);
        folders.forEach(function(f){
          var o = document.createElement("option"); o.value=f; o.textContent="📁 " + f;
          fsel.appendChild(o);
        });
        fsel.value = (prefs.folder !== "all" && prefs.folder !== "") ? prefs.folder : "";
        if(folders.indexOf(fsel.value) < 0) fsel.value = "";
        body.appendChild(fsel);
      }
      var meta = document.createElement("div"); meta.className="mdesc";
      meta.textContent = tf("total_fmt", r.moves.length, tf("first_fmt", colorName(r.firstColor))) +
        (r.notes.length ? " · " + r.notes.join(", ") : "");
      body.appendChild(meta);
      box.appendChild(body);
      var btns = document.createElement("div"); btns.className="mbtns";
      var c1 = document.createElement("button"); c1.textContent=t("btn_cancel"); c1.onclick=close;
      var c2 = document.createElement("button"); c2.textContent=t("btn_save"); c2.className="acc";
      c2.onclick = function(){
        var nm = inp.value.trim();
        if(!nm){ inp.focus(); return; }
        var it = { id: Date.now(), mtime: Date.now(), name: nm, firstColor: r.firstColor, moves: r.moves };
        var folder = fsel ? fsel.value : "";
        if(folder) it.folder = folder;
        var list = loadAll();
        list.unshift(it);
        saveAll(list);
        renderList(); close();
        toast(tf("saved_sgf_fmt", nm, r.moves.length));
      };
      btns.appendChild(c1); btns.appendChild(c2); box.appendChild(btns);
    });
  }

  $("btnSgf").addEventListener("click", function(){
    showModal(function(box, close){
      box.innerHTML = '<h2></h2><div class="mbody"><div class="mdesc"></div></div>';
      box.querySelector("h2").textContent = t("sgf_btn");
      box.querySelector(".mdesc").textContent = t("sgf_desc");
      var body = box.querySelector(".mbody");
      var fileLbl = document.createElement("label");
      fileLbl.className = "ghostbtn";
      fileLbl.style.textAlign = "center";
      fileLbl.textContent = t("sgf_file");
      var fileInp = document.createElement("input");
      fileInp.type = "file"; fileInp.accept = ".sgf,.txt";
      fileInp.style.display = "none";
      fileLbl.appendChild(fileInp);
      var ta = document.createElement("textarea");
      ta.placeholder = "(;GM[1]SZ[19];B[pd];W[dp] ...)";
      body.appendChild(fileLbl); body.appendChild(ta);
      var fname = "";
      fileInp.addEventListener("change", function(){
        var f = fileInp.files[0];
        if(!f) return;
        fname = f.name.replace(/\.(sgf|txt)$/i, "");
        var rd = new FileReader();
        rd.onload = function(){ ta.value = rd.result; };
        rd.readAsText(f);
      });
      var btns = document.createElement("div"); btns.className="mbtns";
      var c1 = document.createElement("button"); c1.textContent=t("btn_cancel"); c1.onclick=close;
      var c2 = document.createElement("button"); c2.textContent=t("btn_import"); c2.className="acc";
      c2.onclick = function(){
        var r = parseSGF(ta.value);
        if(r.error){ toast(r.error); return; }
        close();
        sgfSaveModal(r, fname);
      };
      btns.appendChild(c1); btns.appendChild(c2); box.appendChild(btns);
    });
  });

  /* ===================== 복습 플레이 ===================== */
  var play = null;
  var exam = null;
  var browse = null; // { item, idx }
  var playBoard = makeBoard($("playBoardWrap"), onPlayTap);
  var playZoom = buildZoomSeg($("playZoom"), function(v){ playBoard.setView(v); });
  var browseBoard = makeBoard($("browseBoardWrap"), null);
  var browseZoom = buildZoomSeg($("browseZoom"), function(v){ browseBoard.setView(v); });

  function startBrowse(item){
    browse = { item:item, idx:item.moves.length };
    $("brName").textContent = item.name;
    var v = fitView(item.moves);
    browseBoard.setView(v); browseZoom.set(v);
    $("brHint").textContent = t("browse_hint");
    showView("browse");
    renderBrowse();
  }
  function renderBrowse(){
    if(!browse) return;
    var moves = browse.item.moves;
    browseBoard.render(moves.slice(0, browse.idx), browse.item.firstColor, browse.idx-1);
    $("brCount").textContent = (browse.idx >= moves.length)
      ? t("browse_all") : tf("prog_fmt", browse.idx, moves.length);
    $("brFirst").disabled = browse.idx <= 0;
    $("brPrev").disabled = browse.idx <= 0;
    $("brNext").disabled = browse.idx >= moves.length;
    $("brLast").disabled = browse.idx >= moves.length;
  }
  $("brFirst").addEventListener("click", function(){ if(browse){ browse.idx = 0; renderBrowse(); } });
  $("brPrev").addEventListener("click", function(){ if(browse && browse.idx > 0){ browse.idx--; renderBrowse(); } });
  $("brNext").addEventListener("click", function(){ if(browse && browse.idx < browse.item.moves.length){ browse.idx++; renderBrowse(); } });
  $("brLast").addEventListener("click", function(){ if(browse){ browse.idx = browse.item.moves.length; renderBrowse(); } });
  $("brBack").addEventListener("click", function(){ renderList(); showView("list"); });

  var TC = 18;
  var TRANSFORMS = [
    function(i,j){ return [i, j]; },
    function(i,j){ return [TC-i, j]; },
    function(i,j){ return [i, TC-j]; },
    function(i,j){ return [TC-i, TC-j]; },
    function(i,j){ return [j, i]; },
    function(i,j){ return [TC-j, i]; },
    function(i,j){ return [j, TC-i]; },
    function(i,j){ return [TC-j, TC-i]; }
  ];

  function colorAt(item, idx){
    return (idx%2===0) ? item.firstColor : (item.firstColor==="B"?"W":"B");
  }
  function stopPlay(){
    if(play && play.timer){ clearTimeout(play.timer); }
    play = null;
  }
  function randColor(){ return Math.random() < 0.5 ? "B" : "W"; }

  function startPlay(item, userColor, mode){
    stopPlay();
    var moves = item.moves;
    if(mode === "random"){
      var tr = TRANSFORMS[Math.floor(Math.random()*TRANSFORMS.length)];
      moves = item.moves.map(function(m){ return tr(m[0], m[1]); });
    }
    var playItem = { name:item.name, firstColor:item.firstColor, moves:moves };
    play = { item:playItem, srcItem:item, mode:(mode==="random"?"random":"orig"),
             userColor:userColor, idx:0, mistakes:0, pending:null, timer:null };
    $("playName").textContent =
      (exam ? "[" + (exam.q+1) + "/" + exam.queue.length + "] " : "") +
      item.name + (mode==="random" ? " · " + t("random_tag") : "");
    $("donePanel").hidden = true;
    $("playTools").style.display = "";
    $("pConfirm").style.display = "";
    var v = fitView(moves);
    playBoard.setView(v); playZoom.set(v);
    showView("play");
    renderPlay();
    tickPlay();
  }

  function renderPlay(){
    if(!play) return;
    var shown = play.item.moves.slice(0, play.idx);
    playBoard.render(shown, play.item.firstColor, play.idx-1);
    $("playProg").textContent = tf("prog_fmt", play.idx, play.item.moves.length);
    $("progFill").style.width = (play.idx / play.item.moves.length * 100) + "%";
    $("missCount").textContent = tf("miss_fmt", play.mistakes);
    if(play.pending){
      playBoard.ghost(play.pending[0], play.pending[1], play.userColor);
      $("pConfirm").dataset.active = "1";
      $("pPlace").textContent = tf("place_fmt", colorName(play.userColor), play.idx+1);
    }else{
      playBoard.clearGhost();
      $("pConfirm").dataset.active = "0";
    }
  }

  function setStatus(msg, cls){
    var s = $("playStatus");
    s.textContent = msg;
    s.className = "status" + (cls ? " "+cls : "");
  }

  function tickPlay(){
    if(!play) return;
    if(play.idx >= play.item.moves.length){ finishPlay(); return; }
    var turn = colorAt(play.item, play.idx);
    if(turn === play.userColor){
      setStatus(tf("your_turn_fmt", play.idx+1));
    }else{
      setStatus(t("opp_playing"));
      play.timer = setTimeout(function(){
        if(!play) return;
        play.idx++;
        renderPlay();
        tickPlay();
      }, 750);
    }
  }

  function onPlayTap(i,j){
    if(!play) return;
    if(play.idx >= play.item.moves.length) return;
    if(colorAt(play.item, play.idx) !== play.userColor) return;
    if(tryPlace(play.item.moves.slice(0, play.idx), play.item.firstColor, i, j)) return;
    if(play.pending && play.pending[0]===i && play.pending[1]===j){ confirmPlayMove(); return; }
    play.pending = [i,j];
    renderPlay();
  }

  function confirmPlayMove(){
    if(!play || !play.pending) return;
    var ans = play.item.moves[play.idx];
    var p = play.pending;
    play.pending = null;
    playBoard.clearHint();
    if(p[0]===ans[0] && p[1]===ans[1]){
      play.idx++;
      renderPlay();
      setStatus(t("correct"), "good");
      play.timer = setTimeout(tickPlay, 350);
    }else{
      play.mistakes++;
      renderPlay();
      playBoard.flashWrong(p[0], p[1]);
      setStatus(t("wrong"), "bad");
    }
  }
  $("pPlace").addEventListener("click", confirmPlayMove);
  $("pCancel").addEventListener("click", function(){
    if(play){ play.pending = null; renderPlay(); }
  });

  $("btnHint").addEventListener("click", function(){
    if(!play || play.idx >= play.item.moves.length) return;
    if(colorAt(play.item, play.idx) !== play.userColor){ toast(t("opp_turn_toast")); return; }
    var ans = play.item.moves[play.idx];
    playBoard.hint(ans[0], ans[1]);
    play.mistakes++;
    renderPlay();
    setStatus(t("hint_shown"), "good");
  });

  function finishPlay(){
    setStatus("");
    playBoard.clearGhost(); playBoard.clearHint();
    $("pConfirm").style.display = "none";
    $("playTools").style.display = "none";
    recordStats(play.srcItem.id, play.mistakes);
    var breakBox = $("doneBreak");
    breakBox.hidden = true; breakBox.innerHTML = "";
    if(exam){
      exam.results.push({ name: play.srcItem.name, mistakes: play.mistakes });
      if(exam.q < exam.queue.length - 1){
        $("doneBig").textContent = tf("exam_q_done_fmt", exam.q+1, exam.queue.length);
        $("doneStats").textContent = play.mistakes === 0
          ? t("exam_perfect") : tf("exam_missed_fmt", play.mistakes);
        $("doneList").textContent = t("exam_stop");
        $("doneAgain").textContent = t("exam_next");
      }else{
        var total = 0, perfect = 0;
        exam.results.forEach(function(r){ total += r.mistakes; if(r.mistakes===0) perfect++; });
        $("doneBig").textContent = t("exam_end");
        $("doneStats").textContent = tf("exam_summary_fmt", exam.results.length, perfect, total);
        exam.results.forEach(function(r){
          var d = document.createElement("div");
          d.textContent = (r.mistakes===0 ? "✅ " : "❌ ") + tf("exam_break_fmt", r.name, r.mistakes);
          breakBox.appendChild(d);
        });
        breakBox.hidden = false;
        $("doneList").textContent = t("to_list");
        $("doneAgain").textContent = t("exam_again");
      }
    }else{
      $("doneBig").textContent = t("done_review");
      $("doneStats").textContent = play.mistakes === 0
        ? t("done_perfect")
        : tf("done_missed_fmt", play.item.moves.length, play.mistakes);
      $("doneList").textContent = t("to_list");
      $("doneAgain").textContent = t("again_review");
    }
    $("donePanel").hidden = false;
  }

  $("doneAgain").addEventListener("click", function(){
    if(exam){
      if(exam.q < exam.queue.length - 1){
        exam.q++;
      }else{
        shuffle(exam.queue); exam.q = 0; exam.results = [];
      }
      startPlay(exam.queue[exam.q], randColor(), "random");
      return;
    }
    if(!play) return;
    startPlay(play.srcItem, play.userColor, play.mode);
  });

  $("btnExam").addEventListener("click", function(){
    var all = loadAll();
    var list = all.filter(function(x){
      if(prefs.folder === "all") return true;
      if(prefs.folder === "") return !x.folder;
      return x.folder === prefs.folder;
    });
    if(!list.length){ toast(t("exam_none")); return; }
    var scopeName = prefs.folder==="all" ? t("folder_all") : (prefs.folder==="" ? t("folder_none") : "📁 " + prefs.folder);
    showModal(function(box, close){
      box.innerHTML = '<h2></h2><div class="mbody mdesc"></div>';
      box.querySelector("h2").textContent = t("exam_title");
      box.querySelector(".mbody").textContent = tf("exam_body_fmt", scopeName, list.length);
      var btns = document.createElement("div"); btns.className="mbtns";
      var c1 = document.createElement("button"); c1.textContent=t("btn_cancel"); c1.onclick=close;
      var c2 = document.createElement("button"); c2.textContent=t("btn_start"); c2.className="acc";
      c2.onclick = function(){
        close();
        exam = { queue: shuffle(list.slice()), q: 0, results: [] };
        startPlay(exam.queue[0], randColor(), "random");
      };
      btns.appendChild(c1); btns.appendChild(c2); box.appendChild(btns);
    });
  });

  $("doneList").addEventListener("click", function(){
    renderList(); showView("list");
  });
  $("btnBack").addEventListener("click", function(){
    renderList(); showView("list");
  });

  /* ===================== 언어 설정 ===================== */
  function applyLang(){
    document.title = t("app_title");
    document.documentElement.lang = LOCALES[prefs.lang];
    $("appTitle").textContent = t("app_title");
    $("btnLang").textContent = "🌐 " + LANG_NAMES[prefs.lang];
    $("tabInputLbl").textContent = t("tab_input");
    $("tabReviewLbl").textContent = t("tab_review");
    var fseg = $("firstSeg").querySelectorAll("button");
    fseg[0].textContent = t("first_black");
    fseg[1].textContent = t("first_white");
    $("inCountUnit").textContent = t("moves_unit");
    $("editCancel").textContent = t("edit_cancel");
    $("inHintText").textContent = t("tap_hint_input");
    $("pHintText").textContent = t("tap_hint_play");
    $("inCancel").textContent = t("btn_cancel");
    $("pCancel").textContent = t("btn_cancel");
    $("btnUndo").textContent = t("undo");
    $("btnClear").textContent = t("clear_all");
    $("btnExam").textContent = t("exam_btn");
    $("btnSgf").textContent = t("sgf_btn");
    $("btnExport").textContent = t("backup_export");
    $("btnImport").textContent = t("backup_import");
    $("btnBack").textContent = t("back_btn");
    $("brBack").textContent = t("back_btn");
    $("btnHint").textContent = t("hint_btn");
    $("sortSel").querySelectorAll("option").forEach(function(o){
      o.textContent = t("sort_" + o.value);
    });
    document.querySelectorAll(".seg.zoom button").forEach(function(b){
      b.textContent = t("zoom_" + b.dataset.v);
    });
    var curView = !views.input.hidden ? "input" : (!views.list.hidden ? "list" : (!views.browse.hidden ? "browse" : "play"));
    $("headSub").textContent = subForView(curView);
    if(browse){ $("brHint").textContent = t("browse_hint"); renderBrowse(); }
    renderInput();
    renderList();
    if(play){
      renderPlay();
      if(play.idx < play.item.moves.length && $("donePanel").hidden){
        if(colorAt(play.item, play.idx) === play.userColor){
          setStatus(tf("your_turn_fmt", play.idx+1));
        }else{
          setStatus(t("opp_playing"));
        }
      }
    }
  }

  $("btnLang").addEventListener("click", function(){
    showModal(function(box, close){
      box.innerHTML = '<h2></h2>';
      box.querySelector("h2").textContent = t("lang_title");
      var ml = document.createElement("div"); ml.className="menulist";
      ["ko","zh","ja","en"].forEach(function(lg){
        var b = document.createElement("button");
        b.textContent = (prefs.lang === lg ? "✓ " : "") + LANG_NAMES[lg];
        b.onclick = function(){
          prefs.lang = lg; savePrefs();
          applyLang();
          close();
        };
        ml.appendChild(b);
      });
      var bc = document.createElement("button"); bc.textContent=t("btn_close"); bc.className="quiet"; bc.onclick=close;
      ml.appendChild(bc);
      box.appendChild(ml);
    });
  });

  /* ===================== 시작 ===================== */
  $("sortSel").addEventListener("change", function(){
    prefs.sort = this.value; savePrefs(); renderList();
  });
  applyLang();
  showView("input");
})();
</script>
